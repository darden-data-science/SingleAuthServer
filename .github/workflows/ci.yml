name: CI

on:
  pull_request:
  push:
    # master is this repo's default branch. The sibling ExternalAuthenticator
    # repo had this wrong — it listed master while its default is main, so CI
    # never ran on default-branch pushes. Check before copying this file.
    branches:
      - master
      - "codex/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with the SAML extra
        # xmlsec needs libxmlsec1-dev headers to build, same as the Dockerfile.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxmlsec1-dev
          python -m pip install --upgrade pip build
          python -m pip install -e ".[saml]"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build distribution artifacts
        run: python -m build
