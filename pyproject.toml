[project]
name = "SingleAuthServer"
# Read from SingleAuthServer/_version.py — see [tool.setuptools.dynamic] below.
# Hardcoding it here as well would guarantee the two drift apart.
dynamic = ["version"]
description = "SingleAuthServer: provider-driven external auth for shared-cookie Tornado apps."
readme = "README.md"
license = { text = "BSD" }
authors = [
    { name = "Michael Albert", email = "albertmichaelj@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "sqlalchemy>=2.0",
    "tornado>=6.0.0",
    "traitlets>=4.3.3",
]

[project.optional-dependencies]
saml = [
    "python3-saml>=1.9.0",
    "lxml>=4.4.0",
]

[project.scripts]
auth_server = "SingleAuthServer.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "SingleAuthServer._version.__version__" }

[tool.setuptools.packages.find]
# dev/ is deliberately absent: it holds DevProvider, a login bypass, and must
# never be packaged. See dev/README.md.
include = ["SingleAuthServer*", "single_auth_saml*"]
